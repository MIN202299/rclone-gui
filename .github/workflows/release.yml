name: Release

# Push a tag like v1.2.3 to build a universal DMG and publish it as a GitHub Release.
# Run it manually (Actions → Release → Run workflow) to build a test DMG without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app (Apple Silicon + Intel)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: "1"
        run: ./scripts/bundle.sh

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rclone-${{ steps.version.outputs.version }}
          path: |
            build/Rclone-*.dmg
            build/Rclone-*.dmg.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > build/notes.md <<'EOF'
          ## Install / 安装

          1. Download `Rclone-*.dmg` below, open it, and drag **Rclone** into **Applications**.
             下载下方的 `Rclone-*.dmg`，打开后把 **Rclone** 拖到「应用程序」。
          2. This build isn't notarized by Apple, so macOS blocks the first launch. Open **System Settings → Privacy & Security** and click **Open Anyway**, or run:
             此版本未经 Apple 公证，首次打开会被拦截。请到「系统设置 → 隐私与安全性」点击「仍要打开」，或在终端运行：
             ```bash
             xattr -dr com.apple.quarantine /Applications/Rclone.app
             ```
          3. rclone itself is required. If it isn't installed, the app offers to install it for you.
             需要 rclone。如果还没安装，应用会引导你安装。

          Requires macOS 14 or later · Apple Silicon and Intel · 需要 macOS 14 或更高版本，支持 Apple 芯片和 Intel
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/Rclone-*.dmg build/Rclone-*.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/Rclone-*.dmg build/Rclone-*.dmg.sha256 \
              --title "Rclone GUI ${VERSION}" \
              --notes-file build/notes.md \
              --generate-notes
          fi
